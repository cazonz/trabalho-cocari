<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRE – Controle de EPIs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CRE · Controle de EPIs — folha de estilo única (etapa 1: base consolidada)
   Ordem: 1 tokens · 2 base · 3 estrutura · 4 componentes · 5 janelas ·
          6 documentos (papel claro) · 7 gestão · 8 telas largas / estreitas
   ========================================================================== */

/* 1. Tokens ---------------------------------------------------------------- */
:root{
  /* verdes da marca: ação, superfície elevada, linha de destaque */
  --g9:#0A4A26;--g7:#176B35;--g5:#2E9E4F;--g2:#E6F2E9;--g1:#F4F8F4;--soft:#E6F2E9;
  /* superfícies e texto (tema claro) */
  --bg:#FFFFFF;--card:#F7FAF7;--tx:#18251B;--mu:#5E7265;--ln:#D8E3DA;
  /* estados: vencido (vermelho), vencendo (amarelo) */
  --red:#B42318;--redb:#FDECEA;--amb:#815B00;--ambb:#FFF2CC;
  /* ficha de almoxarifado: superfícies, linhas de registro, sinalização */
  --surface:#F4F8F5;--rule:#DCE6DE;--rule-strong:#AFC2B3;--accent-ui:#2E7042;
  --plate:#DCEBE0;                                   /* placa do logo (provisória: opção B) */
  --st-ok:#3FBF6B;--st-ok-tx:#176B35;                /* em dia: só em etiquetas de situação */
  --st-warn:#F2B705;--st-warn-tx:#805B00;            /* vencendo: amarelo de segurança */
  --st-crit:#DC2924;--st-crit-tx:#B42318;            /* vencido ou com defeito: vermelho do logo */
  --sign-ink:#08140C;--sign-ink-crit:#FFECE9;
  /* tipografia: Archivo (títulos, números, destaques) · Atkinson Hyperlegible Next (leitura) */
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-text:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}

/* 2. Base ------------------------------------------------------------------ */
*{box-sizing:border-box;margin:0}
html{height:100%;color-scheme:light}
body{height:100%;font-family:var(--f-text);font-variant-numeric:tabular-nums;background:var(--bg);color:var(--tx)}
h2{font-family:var(--f-display);font-stretch:85%;font-size:16px;margin:20px 0 10px;font-weight:700}
button:focus-visible{outline:3px solid var(--g5);outline-offset:2px}

/* 3. Estrutura ------------------------------------------------------------- */
.app{width:100%;max-width:1000px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative}
header{background:var(--card);color:var(--tx);padding:0}
.band{background:var(--g9);color:#fff;padding:18px 20px 46px}
.hi{font-family:var(--f-display);font-stretch:80%;margin-top:16px;font-size:22px;font-weight:700;line-height:1.2}
main{padding:16px 16px 120px}
.fab{position:fixed;z-index:3;right:16px;bottom:84px;background:var(--g7);color:#fff;border:0;border-radius:99px;padding:14px 20px;font:inherit;font-family:var(--f-display);font-weight:700;display:flex;gap:8px;align-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(17,122,56,.4)}
.fab svg{width:20px;height:20px}
.note{font-size:11.5px;color:var(--mu);text-align:center;margin-top:16px}

/* 4. Componentes ----------------------------------------------------------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-34px;position:relative}
.st{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.st b{display:block;font-family:var(--f-display);font-stretch:80%;font-size:26px;font-weight:800;line-height:1}
.st span{font-size:12px;color:var(--mu)}
.st.ok b{color:var(--g7)}.st.wa b{color:var(--amb)}.st.er b{color:var(--red)}

.grid{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;width:100%;min-width:0;text-align:left;font:inherit;color:inherit}
button.card{cursor:pointer}
.grid .card{margin:0}
.card.ok{border-left:5px solid var(--g5)}.card.wa{border-left:5px solid #E0A100}.card.er{border-left:5px solid var(--red)}
.ic{width:40px;height:40px;border-radius:12px;background:var(--g2);color:var(--g7);display:grid;place-items:center;flex:none;font-weight:800;font-size:22px}
.ic svg{width:22px;height:22px}
.grow{flex:1;min-width:0}
.t{font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.ok .t,.card.wa .t,.card.er .t{white-space:normal}
.s{font-size:12.5px;color:var(--mu);margin-top:2px}
.tag{font-family:var(--f-display);font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--g2);color:var(--g7)}.tag.wa{background:var(--ambb);color:var(--amb)}.tag.er{background:var(--redb);color:var(--red)}
.bar{height:5px;border-radius:9px;background:var(--ln);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--g7);border-color:var(--g7);color:#fff}
.search{width:100%;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 14px;font:inherit;margin-bottom:12px}
.btn{width:100%;background:var(--g7);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-family:var(--f-display);font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--g2);color:var(--g7)}
.lock{opacity:.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:14px 0;font-size:14px}
.kv span{color:var(--mu)}
.photo{height:150px;border-radius:14px;background:linear-gradient(160deg,var(--g2),var(--g1));border:1px solid var(--ln);display:grid;place-items:center;position:relative;overflow:hidden}
.photo svg{width:90px;height:110px;color:var(--g5)}
.photo em{position:absolute;left:10px;bottom:8px;font-style:normal;font-size:12px;color:var(--mu);background:var(--card);padding:3px 8px;border-radius:99px}

/* 5. Janelas e avisos ------------------------------------------------------ */
.sheet{position:fixed;z-index:10;inset:0;background:rgba(10,30,15,.5);display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.sheet h3{font-family:var(--f-display);font-stretch:85%;font-size:18px;margin-bottom:12px}
.lab{font-size:13px;font-weight:600;margin:12px 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up{border:2px dashed var(--g5);border-radius:14px;padding:16px;text-align:center;color:var(--g7);font-weight:600;font-size:14px;background:var(--g1);cursor:pointer;width:100%;font-family:inherit}
.up.done{border-style:solid;background:var(--g2)}
.toast{position:fixed;z-index:9;left:16px;right:16px;top:16px;max-width:420px;margin:0 auto;background:var(--g9);color:#fff;padding:12px 14px;border-radius:12px;font-weight:600}

/* 6. Documentos (termo e dossiê): papel claro, mantido para impressão ------ */
.paper{background:#fff;color:#14261A;border-radius:10px;padding:16px;font-size:12.5px;line-height:1.5;box-shadow:0 2px 10px rgba(0,0,0,.18);margin-bottom:12px}
.paper .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #117A38;padding-bottom:8px;margin-bottom:10px;font-size:11px;color:#5E7265}
.paper h3{font-family:var(--f-display);font-stretch:85%;font-size:14px;text-align:center;margin:6px 0 10px}
.paper p{margin:6px 0}
.paper table{width:100%;border-collapse:collapse;margin:10px 0}
.paper th,.paper td{border:1px solid #cfdcd2;padding:5px 6px;text-align:left;font-size:11.5px}
.paper th{background:#DCEFE0}
.paper small{display:block;color:#5E7265;font-size:11px;margin-top:4px}
.sig{margin-top:14px;text-align:center}
.sig svg{width:160px;height:50px}
.sig div{border-top:1px solid #14261A;padding-top:4px;font-weight:600}
canvas#pad{width:100%;height:110px;border:1.5px dashed #2E9E4F;border-radius:8px;background:#F1F8F2;touch-action:none;display:block;margin-top:12px}

/* 7. Gestão: mensagem de aviso e tabela de permissões ---------------------- */
.bub{background:#DCF8C6;color:#14261A;border-radius:12px 12px 12px 2px;padding:10px 12px;font-size:13px;margin-top:8px;max-width:92%;line-height:1.45}
.tw{overflow-x:auto}
.mx{width:100%;border-collapse:collapse;font-size:12px;background:var(--card)}
.mx th,.mx td{border:1px solid var(--ln);padding:6px;text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.mx .me{background:var(--g2);font-weight:700}

/* 8. Larguras ---------------------------------------------------------------- */
@media(min-width:900px){
  body{padding-left:200px}
  .app{max-width:none;margin:0}
  .top,.band{padding-left:32px;padding-right:32px}
  main{max-width:none;width:100%;margin:0;padding-left:40px;padding-right:40px;padding-top:28px}
  .fab{right:32px;bottom:32px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}


/* 9. Casca: cabeçalho de ficha e índice de seções ------------------------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:2px solid var(--rule-strong)}
.top img{box-sizing:content-box;background:var(--plate);padding:5px 10px;border-radius:6px}
.av{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;padding:5px 11px;background:none;border:1px solid var(--rule-strong);border-radius:4px;color:var(--tx);font:inherit;cursor:pointer;text-align:left}
.av-k{font-size:11.5px;color:var(--mu);line-height:1.2}
.av-n{font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.2}
nav{position:fixed;z-index:4;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:2px solid var(--rule-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 9px;background:none;border:0;border-left:1px solid var(--rule);color:var(--mu);font:inherit;font-family:var(--f-display);font-weight:600;font-size:11.5px;cursor:pointer}
nav button:first-child{border-left:0}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
nav button.on{color:var(--tx);background:var(--card);box-shadow:inset 0 3px 0 var(--accent-ui)}
.dot{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;padding:1px 4px;background:var(--st-crit);color:var(--sign-ink-crit);font-family:var(--f-display);font-style:normal;font-weight:700;font-size:11px;line-height:1.3;text-align:center;border-radius:3px}

/* 10. Início: quadro de situação ------------------------------------------- */
.m-home{padding-top:20px}
.home{display:flex;flex-direction:column;gap:30px}
.hm-a,.hm-b{display:flex;flex-direction:column;gap:26px;min-width:0}
.ttl{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px}
.ttl-k{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.exemplo{padding:1px 7px;border:1px dashed var(--rule-strong);border-radius:3px;font-size:11.5px}
h1{margin-top:6px;font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:40px;line-height:1}
.ttl-s{display:block;margin-top:6px;font-size:14px;color:var(--mu)}
.go{display:inline-flex;align-items:center;gap:8px;flex:none;padding:11px 14px;background:var(--g7);color:#F1F8F2;border:0;border-radius:4px;font:inherit;font-family:var(--f-display);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.go svg{width:16px;height:16px}
.hero{display:flex;align-items:center;gap:16px}
.hero-n{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:96px;line-height:.9}
.hero-n.er{color:var(--st-crit-tx)}.hero-n.wa{color:var(--st-warn-tx)}.hero-n.ok{color:var(--st-ok-tx)}
.hero-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-t b{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1}
.hero-t span{font-size:14px;color:var(--mu)}
.meter{display:grid;gap:2px;height:12px;margin-top:12px}
.meter i,.mb i{display:block;min-width:0}
.meter .er,.mb .er{background:var(--st-crit)}.meter .wa,.mb .wa{background:var(--st-warn)}.meter .ok,.mb .ok{background:var(--st-ok)}
.sits,.ud,.regs,.doc{border-top:1px solid var(--rule-strong)}
.sit,.ud-r,.reg,.lnk{width:100%;background:none;border:0;border-bottom:1px solid var(--rule);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.sit{display:grid;grid-template-columns:24px 52px minmax(0,1fr) 10px;align-items:center;gap:12px;padding:12px 4px}
.sit .sg{width:24px;height:24px}
.sit b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:34px;line-height:1}
.sit.er b{color:var(--st-crit-tx)}.sit.wa b{color:var(--st-warn-tx)}.sit.ok b{color:var(--st-ok-tx)}
.sit-l{font-size:15px}
.chev{display:block;width:8px;height:8px;border-top:2px solid var(--mu);border-right:2px solid var(--mu);transform:rotate(45deg)}
.sec{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sec h2{margin:0;font-size:15px}
.sec i{flex:1;height:1px;background:var(--rule-strong)}
.sec-n{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--mu)}
.ud-r{display:grid;grid-template-columns:minmax(0,1fr) 96px 26px;align-items:center;gap:12px;padding:11px 8px}
.ud-r[aria-pressed="true"]{background:var(--card);box-shadow:inset 3px 0 0 var(--accent-ui)}
.ud-r[aria-pressed="true"] .ud-n{font-family:var(--f-display);font-weight:700}
.ud-n{font-size:15px}
.ud-c{font-family:var(--f-display);font-weight:700;text-align:right}
.mb{display:grid;gap:2px;height:8px}
.cols{display:flex;justify-content:space-between;gap:12px;padding:0 4px 6px;font-size:12px;color:var(--mu)}
.reg{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 4px}
.pic{display:grid;place-items:center;width:44px;height:44px;background:var(--card);border:1px solid var(--rule-strong);border-radius:4px;color:var(--tx)}
.pic svg{width:26px;height:26px;fill:currentColor}
.rg-main{display:flex;flex-direction:column;gap:5px;min-width:0}
.rg-n{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.15}
.rg-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--mu)}
.ca{padding:0 5px;border:1px solid var(--rule-strong);border-radius:3px;font-size:12px;font-weight:700;color:var(--tx)}
.rg-v{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.rg-d{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1}
.rg-s{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.rg-s svg{width:14px;height:14px;flex:none}
.reg.er .rg-d,.reg.er .rg-s{color:var(--st-crit-tx)}
.reg.wa .rg-d,.reg.wa .rg-s{color:var(--st-warn-tx)}
.reg.ok .rg-s{color:var(--st-ok-tx)}
.doc-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 12px;padding:12px 4px;border-bottom:1px solid var(--rule)}
.doc-r b{font-family:var(--f-display);font-weight:700}
.mbar{grid-column:1/-1;height:6px;background:var(--rule)}
.mbar i{display:block;height:100%;background:var(--accent-ui)}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;color:var(--accent-ui);font-family:var(--f-display);font-weight:600}
.lnk .chev{border-color:var(--accent-ui)}
.sg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sit:focus-visible,.ud-r:focus-visible,.reg:focus-visible,.lnk:focus-visible,.go:focus-visible,.av:focus-visible,nav button:focus-visible{outline:3px solid var(--accent-ui);outline-offset:-3px}
@media(max-width:380px){
  .reg{grid-template-columns:44px minmax(0,1fr)}
  .rg-v{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;gap:4px 12px;text-align:left}
  h1{font-size:34px}.hero-n{font-size:88px}
}
@media(min-width:900px){
  nav{top:0;right:auto;bottom:0;width:200px;display:flex;flex-direction:column;padding:96px 0 0;border-top:0;border-right:2px solid var(--rule-strong)}
  nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:14px 18px;border-left:0;border-top:1px solid var(--rule);font-size:14.5px}
  nav button:first-child{border-top:0}
  nav button.on{box-shadow:inset 3px 0 0 var(--accent-ui)}
  .dot{top:50%;left:auto;right:16px;transform:translateY(-50%)}
  .home{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);column-gap:48px;row-gap:28px;align-items:start}
  .ttl{grid-column:1/-1}
}
@media(max-width:899px){nav button{font-size:10.5px;letter-spacing:-.01em;font-stretch:88%;min-width:0}}@media(max-width:360px){nav button{font-size:9px;letter-spacing:-.02em;padding-left:0;padding-right:0}}

/* ===== 11. Tela de EPIs (registro) ===== */
.epis{display:flex;flex-direction:column;gap:14px}
.epis .ttl{align-items:center}
.epis h1{margin-top:0;font-size:36px}
.flt{display:flex;flex-direction:column;gap:6px}
.sc{position:relative;margin-inline:-16px}
.sc::after{content:"";position:absolute;top:0;right:0;bottom:0;width:36px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg))}
.ix,.un{display:flex;overflow-x:auto;padding-inline:16px 40px;scrollbar-width:none}
.ix::-webkit-scrollbar,.un::-webkit-scrollbar{display:none}
.ix{border-bottom:1px solid var(--rule-strong)}
.ix-b{flex:none;display:flex;align-items:baseline;gap:7px;padding:10px 14px 9px 0;margin-right:6px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--mu);font:inherit;font-family:var(--f-display);font-weight:600;font-size:14.5px;cursor:pointer;min-height:44px;white-space:nowrap}
.ix-b b{font-weight:700;font-size:13px;color:var(--mu)}
.ix-b.er b{color:var(--st-crit-tx)}.ix-b.wa b{color:var(--st-warn-tx)}.ix-b.ok b{color:var(--st-ok-tx)}
.ix-b[aria-pressed="true"]{color:var(--tx);border-bottom-color:var(--accent-ui)}
.un{gap:6px;align-items:center}
.un-b{flex:none;padding:6px 11px;background:none;border:1px solid var(--rule);border-radius:3px;color:var(--mu);font:inherit;font-size:13px;cursor:pointer;min-height:34px;white-space:nowrap}
.un-b[aria-pressed="true"]{background:var(--card);color:var(--tx);border-color:var(--accent-ui);font-weight:700}
.ix-b:focus-visible,.un-b:focus-visible,.rg:focus-visible,.how summary:focus-visible{outline:2px solid var(--accent-ui);outline-offset:-2px}
.grps{display:flex;flex-direction:column;gap:20px}
.gh{display:flex;align-items:baseline;gap:8px;margin:0 0 2px;font-family:var(--f-text);font-weight:600;font-size:13px;color:var(--mu)}
.gh span{font-weight:600}
.grp.er .gh{color:var(--st-crit-tx)}.grp.wa .gh{color:var(--st-warn-tx)}.grp.ok .gh{color:var(--st-ok-tx)}
.rg{display:grid;width:100%;grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"pic main d" "pic meta meta" "pic rule rule";align-items:start;column-gap:12px;row-gap:3px;padding:11px 0;background:none;border:0;border-top:1px solid var(--rule);color:inherit;font:inherit;text-align:left;cursor:pointer}
.regs .rg:last-child{border-bottom:1px solid var(--rule)}

const DB_KEY='cre-epi-local-db-v1';
const DB_BACKUP_KEY=DB_KEY+'-backup-v1';
const DB_VERSION=2;
let storageNotice='';
function loadDB(){
const defaults={version:DB_VERSION,requests:[],changes:[],employees:[],units:[],epis:EPIS,coop:COOP,stockItems:[],stockMovements:[],deliveries:[]};
try{
const raw=localStorage.getItem(DB_KEY);
if(!raw)return defaults;
let saved;
try{saved=JSON.parse(raw)}catch(error){
let backedUp=false;try{if(!localStorage.getItem(DB_BACKUP_KEY))localStorage.setItem(DB_BACKUP_KEY,raw);backedUp=!!localStorage.getItem(DB_BACKUP_KEY)}catch(backupError){}
storageNotice=backedUp?'Os dados locais estavam inválidos. Uma cópia foi preservada; a tela usa os dados demonstrativos e os registros recuperáveis.':'Os dados locais estavam inválidos e não foi possível preservar uma cópia no navegador; a tela usa os dados demonstrativos.';
return defaults
}
const oldVersion=Number(saved.version)||1;
if(oldVersion<DB_VERSION&&!localStorage.getItem(DB_BACKUP_KEY)){try{localStorage.setItem(DB_BACKUP_KEY,raw)}catch(error){storageNotice='Não foi possível criar o backup da versão antiga; os registros existentes foram carregados sem substituição.'}}
const migrated={...defaults,...saved,version:DB_VERSION};
migrated.requests=Array.isArray(saved.requests)?saved.requests:[];
migrated.changes=Array.isArray(saved.changes)?saved.changes:[];
migrated.employees=Array.isArray(saved.employees)?saved.employees:[];
migrated.units=Array.isArray(saved.units)?saved.units:[];
migrated.epis=Array.isArray(saved.epis)?saved.epis:EPIS;
migrated.coop=Array.isArray(saved.coop)?saved.coop:COOP;
migrated.stockItems=Array.isArray(saved.stockItems)?saved.stockItems:[];
migrated.stockMovements=Array.isArray(saved.stockMovements)?saved.stockMovements:[];
migrated.deliveries=Array.isArray(saved.deliveries)?saved.deliveries:[];
migrated.employees=migrated.employees.map((person,index)=>({...person,id:person.id||'migrated-colaborador-'+index}));
migrated.coop=migrated.coop.map((person,index)=>({...person,id:person.id||'migrated-coop-'+index}));
migrated.coop=migrated.coop.map(person=>{const d=DEMO_COOP.find(x=>x.cargo&&x.n==person.n&&x.s==person.s);if(person.demo&&d)return{...person,cargo:d.cargo,setor:d.setor};if(person.cargo)return person;return d?{...person,cargo:d.cargo,setor:d.setor}:person});
migrated.employees.forEach(person=>{const name=normalizeText(person.name),unit=normalizeText(person.unit),matches=migrated.coop.filter(item=>item.id==person.id||name&&unit&&normalizeText(item.n)==name&&normalizeText(item.s)==unit);if(matches.length==1)matches[0].id=person.id;else migrated.coop.push({id:person.id,n:person.name,s:person.unit,m:'',cargo:person.cargo,setor:person.setor,termo:null,foto:false,demo:false})});
migrated.epis=migrated.epis.map((epi,index)=>({...epi,recordId:epi.recordId||'migrated-epi-'+index,employeeId:migrated.coop.some(person=>person.id==epi.employeeId)?epi.employeeId:migrated.coop[epi.c]?.id}));

/* Dados de demonstração da Gestão: estoque, histórico e fechamento mensal (só aplicados quando o navegador ainda não tem registros) */
function buildDemoSeed(){
const DAY=864e5,NOW=new Date();
const ago=(d,h,m)=>{const t=new Date(NOW.getTime()-d*DAY);t.setHours(h||9,m||0,0,0);return t.toISOString()};
const inMonth=(offset,day,h)=>{const t=new Date(NOW.getFullYear(),NOW.getMonth()+offset,offset==0?Math.min(day,NOW.getDate()):day,h||9,15,0,0);return t.toISOString()};
const plusDays=(iso,n)=>{const t=new Date(iso);t.setDate(t.getDate()+n);return t.toISOString()};
const MEAS=['un','par','un','par','un','un','un','un'];
const LEVEL=[[14,5],[40,20],[3,10],[6,4],[120,50],[8,5],[2,2],[9,4]];
const OPS=[
[[12,'saida',2,'Almoxarife'],[5,'saida',1,'Almoxarife']],
[[20,'saida',10,'Almoxarife'],[9,'entrada',20,'Almoxarife'],[3,'saida',6,'Almoxarife']],
[[18,'saida',4,'Almoxarife'],[7,'saida',3,'Almoxarife']],
[[15,'saida',1,'Almoxarife'],[2,'saida',1,'Almoxarife']],
[[25,'saida',30,'Almoxarife'],[10,'entrada',60,'Técnico de SST'],[4,'saida',20,'Almoxarife']],
[[16,'saida',2,'Almoxarife'],[6,'saida',1,'Almoxarife']],
[[11,'saida',1,'Almoxarife']],
[[8,'saida',2,'Almoxarife']]];
const stockItems=[],stockMovements=[],changes=[];
DEMO_EPIS.forEach((epi,i)=>{
const unitName=DEMO_COOP[epi.c].s,[balance,minimum]=LEVEL[i],measure=MEAS[i];
const net=OPS[i].reduce((sum,o)=>sum+(o[1]=='entrada'?o[2]:-o[2]),0),start=balance-net;
const item={id:'demo-stock-'+(i+1),name:epi.n,ca:epi.ca,unitMeasure:measure,unitName,balance,minimum,createdAt:ago(40,8,30)};
stockItems.push(item);
let running=start;
const first={id:'demo-mov-'+(i+1)+'-0',itemId:item.id,itemName:item.name,ca:item.ca,type:'entrada',quantity:start,balanceAfter:start,unitMeasure:measure,unitName,at:ago(40,8,30),by:'Almoxarife'};
stockMovements.push(first);
OPS[i].forEach((o,k)=>{running+=o[1]=='entrada'?o[2]:-o[2];stockMovements.push({id:'demo-mov-'+(i+1)+'-'+(k+1),itemId:item.id,itemName:item.name,ca:item.ca,type:o[1],quantity:o[2],balanceAfter:running,unitMeasure:measure,unitName,at:ago(o[0],10+k,20+i),by:o[3]})});
});
stockMovements.forEach(m=>changes.push({id:'demo-evt-'+m.id,action:m.type=='entrada'?'Entrada de estoque':'Saída de estoque',detail:`${m.itemName} · CA ${m.ca} · ${m.quantity} ${m.unitMeasure} · saldo ${m.balanceAfter}`,at:m.at,by:m.by,unit:m.unitName}));
const R=(n,cargoIdx,epiName,status,createdAt,by)=>{const emp=DEMO_COOP[n-1],role=CARGO_EPIS[cargoIdx],item=role.epis.find(e=>e.nome==epiName)||role.epis[0];const done=status=='completed';return{id:'demo-req-'+(requests.length+1)+'-0',groupId:'demo-req-'+(requests.length+1),employeeId:'demo-colaborador-'+n,name:emp.n,unit:emp.s,setor:role.setor,cargo:role.cargo,epi:item.nome,periodicidade:item.periodicidade,status,createdAt,requestedBy:by,completedAt:done?plusDays(createdAt,1):null,completedBy:done?'Almoxarife':null}};
const requests=[];
const add=(...a)=>requests.push(R(...a));
add(1,4,'Capacete','pending',inMonth(0,5,8),'Técnico de SST');
add(2,2,'Abafador','completed',inMonth(0,2,9),'Gestor de unidade');
add(3,1,'Protetor auricular moldado','pending',inMonth(0,4,10),'Gestor de unidade');
add(4,4,'Botina de segurança (Zarpellon / Marluvas)','completed',inMonth(0,3,14),'Técnico de SST');
add(5,4,'Capacete','pending',inMonth(0,5,15),'Gestor de unidade');
add(2,2,'Máscara PFF1','completed',inMonth(0,1,8),'Gestor de unidade');
add(3,1,'Abafador','completed',inMonth(-1,8,9),'Gestor de unidade');
add(1,4,'Máscara PFF2','completed',inMonth(-1,15,11),'Técnico de SST');

function completeRequest(id){
if(!authorize('entrega'))return;
const request=S.requests.find(item=>item.id==id&&item.status=='pending');
if(!request){note('A solicitação não está mais pendente.');return}
const employee=COOP.find(person=>person.id==request.employeeId);
if(!employee||normalizeText(employee.s)!=normalizeText(request.unit)){note('A solicitação não está vinculada a um colaborador/unidade consistente. Corrija o cadastro antes de entregar.');return}
if(scope()&&normalizeText(employee.s)!=normalizeText(scope())){note('Seu perfil simulado não pode concluir solicitações de outra unidade.');return}
const candidates=EPIS.map((epi,index)=>({epi,index})).filter(({epi})=>requestMatchesItem(request,epi));
if(!candidates.length){note('Não há item correspondente com CA cadastrado para esta solicitação.');return}
S.requestOpen=false;S.pendingRequestId=request.id;S.sheet=true;S.fc=COOP.indexOf(employee);S.fe=candidates.length==1?candidates[0].index:-1;S.foto=null;S.termo=null;S.cond='ok';S.deliveryValidUntil='';render()
}

function pad(c){const x=c.getContext('2d');x.lineWidth=2.5;x.lineCap='round';x.strokeStyle='#0A4A26';let d=false;drew=false;
const p=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);const [a,b]=p(e);x.beginPath();x.moveTo(a,b)};
c.onpointermove=e=>{if(!d)return;const [a,b]=p(e);x.lineTo(a,b);x.stroke();drew=true};
c.onpointerup=()=>{d=false}}

}
function requestCA(r){

let g=null;
if(d.stockAdd||d.stockMove||d.stockCommit)g='estoque';
else if(d.requestComplete)g='entrega';
else if(d.requestSubmit)g='solicitacao';
else if(d.deliveryConfirm)g='entrega';
else if(d.employeeAdd||d.unitAdd)g='cadastro';
else if(d.sheet||d.save||d.pick||d.rmfoto||d.rmtmp)g='entrega';
else if(d.sign)g='assinar';
else if(d.dos)g='dossie';
else if(d.opt)g='config';
else if(d.seg=='def')g='defeito';
else if(d.act&&d.act!='undefeito')g=d.act;
if(g&&!authorize(g))return;
if(d.tab){S.tab=d.tab;S.c=null;scrollTo(0,0)}
else if(d.go){const [t,f]=d.go.split('|');S.tab=t;S.f=f;scrollTo(0,0)}
else if(d.f)S.f=d.f;
else if(d.c){S.c=+d.c;scrollTo(0,0)}
else if(d.back)S.c=null;
else if(d.u)S.u=d.u;
else if(d.role){S.role=d.role;S.c=null}
else if(d.opt)S.opt[d.opt]=!S.opt[d.opt];
else if(d.epi)S.epi=+d.epi;
else if(d.doc)S.doc=true;
else if(d.dos)S.dos=true;
else if(d.sheet){S.sheet=true;S.foto=null;S.termo=null;S.cond='ok';S.fc=S.c!=null?S.c:0;S.fe=Math.max(0,EPIS.findIndex(e=>e.c==S.fc))}
else if(d.close){S.sheet=S.doc=S.dos=false;S.epi=null;S.cf=null;S.fpv=null;S.monthOpen=false;S.requestOpen=false;S.stockMove=null;S.deliveryPending=null;S.pendingRequestId=null}
else if(d.cfno){if(S.cf&&S.cf.k=='foto')S.fpv=null;S.cf=null}
else if(d.cfyes){doConfirm();return}
else if(d.pick){const i=document.getElementById(d.pick=='termo'?'tpick':'fpick');if(i){i.value='';i.click()}return}
else if(d.rmtmp){S[d.rmtmp]=null}
else if(d.rmfoto){S.cf={k:'rmfoto'}}
else if(d.print){try{window.print()}catch(x){note('A impressão não está disponível neste ambiente.')}return}
else if(d.monthGenerate){const month=document.getElementById('month-ref').value;const unit=S.monthScope=='unit'?document.getElementById('month-unit').value.trim():'';if(!month||(S.monthScope=='unit'&&!unit)){note('Informe a competência e a unidade para gerar a ficha.');return}S.month=month;if(S.monthScope=='unit')S.monthUnit=unit;S.monthReady=true}
else if(d.monthOpen)S.monthOpen=true;
else if(d.monthPick){const picker=document.getElementById('month-pick');picker.value='';picker.click();return}
else if(d.monthScope){S.monthScope=d.monthScope}
else if(d.stockAdd){addStockItem();return}
else if(d.stockMove){if(!S.stockItems.some(item=>item.id==d.stockId)||!['entrada','saida'].includes(d.stockMove)){note('Item ou tipo de movimentação inválido.');return}S.stockMove={id:d.stockId,type:d.stockMove}}
else if(d.stockCommit){moveStock();return}
else if(d.employeeAdd){const group=CARGO_EPIS[S.employeeCargo],name=S.employeeName.trim(),unit=S.employeeUnit.trim();if(!name||name.length>120||!unit||unit.length>100||!group){note('Informe nome (até 120 caracteres), unidade (até 100) e cargo válidos.');return}if(COOP.some(person=>normalizeText(person.n)==normalizeText(name)&&normalizeText(person.s)==normalizeText(unit))){note('Já existe colaborador com este nome nesta unidade.');return}const id=newId('colaborador'),createdAt=new Date().toISOString(),person={id,name,unit,cargo:group.cargo,setor:group.setor,createdAt};const previousUnits=S.units.length;S.employees.push(person);COOP.push({id,n:name,s:unit,m:'',cargo:group.cargo,setor:group.setor,termo:null,foto:false,demo:false});if(!unitOptions().some(value=>normalizeText(value)==normalizeText(unit)))S.units.push(unit);const saved=recordChange('Colaborador cadastrado',`${name} · ${id} · ${group.cargo}`,unit);if(!saved){S.employees=S.employees.filter(item=>item.id!=id);COOP=COOP.filter(item=>item.id!=id);S.units.splice(previousUnits);note('Não foi possível salvar o cadastro e sua auditoria no armazenamento local.');return}S.employeeName='';S.employeeUnit='';S.employeeCargo=-1;note('Colaborador cadastrado e salvo neste navegador.')}
else if(d.unitAdd){const unit=S.newUnit.trim();if(!unit||unit.length>100){note('Informe o nome da unidade (até 100 caracteres).');return}if(unitOptions().some(value=>normalizeText(value)==normalizeText(unit))){note('Esta unidade já está disponível para seleção.');return}S.units.push(unit);const saved=recordChange('Unidade cadastrada',unit,unit);if(!saved){S.units.pop();note('Não foi possível salvar a unidade e sua auditoria no armazenamento local.');return}S.newUnit='';note('Unidade adicionada às opções e salva neste navegador.')}
else if(d.requestOpen){S.requestOpen=true;S.requestEmployeeId='';S.requestCargo=-1;S.requestItems=[]}
else if(d.requestSubmit){
const employee=COOP.find(person=>person.id==S.requestEmployeeId),role=CARGO_EPIS[S.requestCargo];
if(!employee||!employee.id||!employee.s||!role){note('Selecione um colaborador cadastrado, com unidade, e informe o cargo.');return}
if(employee.cargo&&normalizeText(employee.cargo)!=normalizeText(role.cargo)){note('O cargo informado não corresponde ao cadastro do colaborador.');return}
if(!S.requestItems.length||S.requestItems.some(index=>!role.epis[index])){note('Selecione ao menos um EPI válido para este cargo.');return}
const selected=S.requestItems.map(index=>role.epis[index]),duplicates=selected.filter(item=>S.requests.some(request=>request.status=='pending'&&request.employeeId==employee.id&&normalizeText(request.unit)==normalizeText(employee.s)&&normalizeText(request.epi)==normalizeText(item.nome)));
if(duplicates.length){note('Já existe solicitação pendente para: '+duplicates.map(item=>item.nome).join(', '));return}
const createdAt=new Date().toISOString(),groupId=newId('req'),first=S.requests.length;
selected.forEach((item,index)=>S.requests.push({id:groupId+'-'+index,groupId,employeeId:employee.id,name:employee.n,unit:employee.s,setor:role.setor,cargo:role.cargo,epi:item.nome,periodicidade:item.periodicidade,status:'pending',createdAt,requestedBy:ROLES[S.role].n,completedAt:null,completedBy:null}));
const saved=recordChange('Solicitação criada',`${employee.n} · ${employee.id} · ${selected.map(item=>item.nome).join(', ')}`,employee.s);
if(!saved)S.requests.splice(first);
S.requestOpen=false;S.requestCargo=-1;S.requestItems=[];S.requestEmployeeId='';note(saved?'Solicitação registrada e salva neste navegador.':'Não foi possível salvar a solicitação e sua auditoria no armazenamento local.');return}
else if(d.requestComplete){completeRequest(d.requestComplete);return}
else if(d.act){const x=EPIS[S.epi];S.cf={k:(d.act=='undefeito'&&!isAdmin())?'noadmin':d.act,i:S.epi}}
else if(d.sign){if(!drew){document.getElementById('hint').textContent='Assine no quadro antes de salvar';return}const person=COOP[S.c],canvas=document.getElementById('pad');if(!person||!canvas){note('Não foi possível registrar a assinatura.');return}const previous={termo:person.termo,signature:person.signature};try{person.signature=canvas.toDataURL('image/png');person.termo=fmt()}catch(error){note('Não foi possível capturar a assinatura neste navegador.');return}if(!logw('Termo assinado',`${person.n} · ${person.id}`,person.s)){Object.assign(person,previous);note('Não foi possível salvar a assinatura e sua auditoria no armazenamento local.');return}S.doc=false;note('Termo assinado e anexado ao colaborador');return}
else if(d.save){
const c=COOP[S.fc],e=EPIS[S.fe];
if(!c||!e||!c.id){note('Colaborador ou EPI inválido.');return}
if(S.cond=='def'&&!authorize('defeito'))return;
if(S.pendingRequestId){const request=S.requests.find(item=>item.id==S.pendingRequestId&&item.status=='pending');if(!request||request.employeeId!=c.id||normalizeText(request.unit)!=normalizeText(c.s)||!requestMatchesItem(request,e)){note('Inconsistência entre colaborador, unidade, item e solicitação.');return}}
const matching=S.requests.filter(request=>request.status=='pending'&&request.employeeId==c.id&&normalizeText(request.unit)==normalizeText(c.s)&&requestMatchesItem(request,e));
if(!S.pendingRequestId&&matching.length>1){note('Há solicitações duplicadas pendentes para este colaborador e item. Corrija-as antes de registrar.');return}
const location=normalizeText(c.s),stock=S.stockItems.find(item=>normalizeText(item.name)==normalizeText(e.n)&&normalizeText(item.ca)==normalizeText(e.ca)&&(normalizeText(item.unitName)==location||normalizeText(item.unitName)=='todas as unidades'));
if(stock&&Number(stock.balance)>0){S.deliveryPending={stockId:stock.id};S.sheet=false;render();return}
commitDelivery(false);return}
else if(d.deliveryConfirm){if(d.deliveryConfirm=='cancel'){S.deliveryPending=null;S.pendingRequestId=null;S.foto=null;S.termo=null;note('Entrega cancelada.');return}commitDelivery(d.deliveryConfirm=='debit');return}
else if(d.toast){S.sheet=S.doc=S.dos=false;S.epi=null;note(d.toast);return}
else if(d.seg){S.cond=d.seg}
render()});
app.addEventListener('change',e=>{const t=e.target;
if(t.id=='request-employee'){S.requestEmployeeId=t.value;const person=COOP.find(item=>item.id==t.value);S.requestName=person?person.n:'';S.requestUnit=person?person.s:'';S.requestCargo=person?CARGO_EPIS.findIndex(group=>normalizeText(group.cargo)==normalizeText(person.cargo)):-1;S.requestItems=[];render();return}
if(t.id=='request-cargo'){S.requestCargo=Number(t.value);S.requestItems=[];render();return}
if(t.dataset&&t.dataset.requestItem!=null){const index=Number(t.dataset.requestItem);S.requestItems=t.checked?[...new Set([...S.requestItems,index])]:S.requestItems.filter(item=>item!=index);render();return}
if(t.dataset&&t.dataset.sel){S[t.dataset.sel]=+t.value;render();return}
if(t.id=='fpick'){const f=t.files&&t.files[0];if(!f)return;readImg(f,src=>{if(!src){note('Escolha um arquivo de imagem válido.');return}if(!can('entrega')){deny();return}if(S.sheet){S.foto=src;render()}else{S.fpv=src;S.cf={k:'foto'};render()}});return}
if(t.id=='tpick'){const f=t.files&&t.files[0];if(f&&can('entrega')){S.termo={nome:f.name};render()}return}
if(t.id=='month-pick'){const f=t.files&&t.files[0];if(f){S.monthAttachment=f.name;render()}}});
render();
</script>
</body>
